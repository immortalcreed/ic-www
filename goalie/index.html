<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Reveal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="base-layer"></div>
    <div id="overlay-layer"></div>

    <!-- HUD: top-right progress display -->
    <div id="hud">
        <div id="hud-label">Campaign Progress</div>
        <div id="hud-counter">
            <span id="hud-current">0</span><span class="hud-slash"> / </span><span id="hud-target">—</span>
        </div>
        <div id="hud-track"><div id="hud-fill"></div></div>
        <div id="hud-pct">Set a target below</div>
        <div id="hud-bonus" style="display:none">
            <div id="hud-bonus-plus"><span id="hud-target-echo"></span><span class="hud-op"> +</span><span id="hud-bonus-amt"></span><span class="hud-contacts"> BONUS</span></div>
            <div id="hud-bonus-total"><span class="hud-op">=&nbsp;</span><span id="hud-total-amt"></span><span class="hud-contacts">&nbsp;CONTACTS</span></div>
        </div>
    </div>

    <!-- Control panel -->
    <div id="panel" hidden="true">
        <div class="field-row">
            <div class="field">
                <label for="in-current">Current Total Contacts</label>
                <input id="in-current" type="number" placeholder="0" min="0" onkeydown="if(event.key==='Enter')handleReveal()">
            </div>
            <button id="btn-reveal" onclick="handleReveal()" disabled>Reveal</button>
        </div>
    </div>

    <!-- Toggle button -->
    <button id="toggle-btn" onclick="togglePanel()" title="Toggle Controls">&#9881;&nbsp;&nbsp;Update</button>

    <div id="complete-banner">GOAL REACHED!</div>

    <script src="app.js"></script>
</body>
</html>
